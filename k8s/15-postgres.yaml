# PostgreSQL for rollout history. One replica with a persistent volume (kind's local-path
# storage); the control plane restores the last promoted routes from it on startup.
apiVersion: v1
kind: Secret
metadata: {name: postgres, namespace: edge}
stringData:
  username: edge
  password: edge-local-dev     # demo only; use a real secret store (or Cloud SQL) on GKE
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: edge}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: edge}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: postgres, key: username}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres, key: password}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "edge", "-d", "edge"]}
          periodSeconds: 2
        resources:
          requests: {cpu: 100m, memory: 128Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: edge}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
