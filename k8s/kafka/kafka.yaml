# Single-node Kafka (KRaft, one combined controller+broker) managed by Strimzi, sized for a laptop.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels: {strimzi.io/cluster: edge-kafka}
spec:
  replicas: 1
  roles: [controller, broker]
  storage: {type: ephemeral}      # demo: access logs are replayable from Envoy, not precious
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {memory: 1536Mi}
  jvmOptions: {-Xms: 512m, -Xmx: 512m}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata: {name: edge-kafka, namespace: kafka}
spec:
  kafka:
    listeners:
    - {name: plain, port: 9092, type: internal, tls: false}
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources: {requests: {cpu: 20m, memory: 128Mi}}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: envoy-access-logs
  namespace: kafka
  labels: {strimzi.io/cluster: edge-kafka}
spec:
  partitions: 3
  replicas: 1
  config: {retention.ms: 3600000}     # 1 hour
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: route-stats
  namespace: kafka
  labels: {strimzi.io/cluster: edge-kafka}
spec:
  partitions: 3
  replicas: 1
  config: {retention.ms: 3600000}
