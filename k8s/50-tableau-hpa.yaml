# Scales tableau on CPU. Needs metrics-server, which scripts/kind-up.sh installs.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: tableau, namespace: edge}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tableau}
  minReplicas: 1
  maxReplicas: 16
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 50}
