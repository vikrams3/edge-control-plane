# Two mock backend services. tableau burns CPU per request for the HPA demo; sales is a plain echo.
apiVersion: v1
kind: ConfigMap
metadata: {name: tableau-app, namespace: edge}
data:
  # tableau burns about 10 ms of CPU per request, so the HPA has something to react to.
  server.py: |
    import hashlib
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"          # keep-alive, so Envoy reuses connections
        disable_nagle_algorithm = True         # headers and body go out as separate writes; with
                                               # Nagle + delayed ACK that stalls each reply ~40 ms

        def do_GET(self):
            h = b"tableau"
            for _ in range(20000):
                h = hashlib.sha256(h).digest()
            body = b"hello from tableau"
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    class Server(ThreadingHTTPServer):
        request_queue_size = 1024              # the default backlog of 5 resets bursts of connections
        daemon_threads = True

    Server(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tableau, namespace: edge}
spec:
  replicas: 1                      # the HPA in 50-tableau-hpa.yaml owns this from here
  selector: {matchLabels: {app: tableau}}
  template:
    metadata: {labels: {app: tableau}}
    spec:
      containers:
      - name: tableau
        image: python:3.13-alpine
        command: ["python", "-u", "/app/server.py"]
        ports: [{containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 2
        resources:
          # No CPU limit: a 500m limit throttled each pod in 100 ms CFS periods, which pinned
          # p50 at 50 ms and stretched p99. The HPA scales on the request instead.
          requests: {cpu: 200m, memory: 32Mi}
          limits: {memory: 64Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes:
      - name: app
        configMap: {name: tableau-app}
---
apiVersion: v1
kind: Service
metadata: {name: tableau, namespace: edge}
spec:
  selector: {app: tableau}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sales, namespace: edge}
spec:
  replicas: 2
  selector: {matchLabels: {app: sales}}
  template:
    metadata: {labels: {app: sales}}
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args: ["-text=hello from sales", "-listen=:8080"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: sales, namespace: edge}
spec:
  selector: {app: sales}
  ports: [{port: 8080}]
---
# billing is configured in the control plane but scaled to zero, so it has no healthy pods.
# The demo routes a hostname to it to show a change that passes validation and still fails.
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing, namespace: edge}
spec:
  replicas: 0
  selector: {matchLabels: {app: billing}}
  template:
    metadata: {labels: {app: billing}}
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args: ["-text=hello from billing", "-listen=:8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: billing, namespace: edge}
spec:
  selector: {app: billing}
  ports: [{port: 8080}]
