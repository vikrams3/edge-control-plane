# Two mock backend services standing in for Salesforce clouds.
apiVersion: apps/v1
kind: Deployment
metadata: {name: tableau, namespace: edge}
spec:
  replicas: 2
  selector: {matchLabels: {app: tableau}}
  template:
    metadata: {labels: {app: tableau}}
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args: ["-text=hello from tableau", "-listen=:8080"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: tableau, namespace: edge}
spec:
  selector: {app: tableau}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sales, namespace: edge}
spec:
  replicas: 2
  selector: {matchLabels: {app: sales}}
  template:
    metadata: {labels: {app: sales}}
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args: ["-text=hello from sales", "-listen=:8080"]
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: sales, namespace: edge}
spec:
  selector: {app: sales}
  ports: [{port: 8080}]
