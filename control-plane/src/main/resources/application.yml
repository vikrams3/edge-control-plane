server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/edge
    username: edge
    password: edge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema

management:
  endpoints:
    web:
      exposure:
        include: health,info

edge:
  xds-port: 18000
  canary-url: http://envoy-canary:10000/
  probe-requests-per-host: 25
  max-error-rate: 0.05
  ack-timeout-millis: 5000
  backends:
    tableau: tableau:8080
    sales: sales:8080
    billing: billing:8080     # deliberately has no running instances: the demo's "backend is down"
  initial-routes:
    "[tableau.edge.local]": tableau
    "[sales.edge.local]": sales
