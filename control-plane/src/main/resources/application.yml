server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/edge
    username: edge
    password: edge
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

edge:
  xds-port: 18000
  canary-url: http://envoy-canary:10000/
  probe-requests-per-host: 25
  max-error-rate: 0.05
  ack-timeout-millis: 5000
  probe: synthetic            # or "prometheus" / "kafka": canary error rate from real traffic
  prometheus-url: http://kps-prometheus.monitoring.svc.cluster.local:9090
  probe-window-seconds: 30    # how long the prometheus probe watches the canary
  analytics-url: http://analytics.edge.svc.cluster.local:8080   # for probe: kafka
  xds-tls:                    # mTLS on the xDS channel; plaintext if the files are missing
    cert-file: /etc/edge/xds-tls/server.crt
    key-file: /etc/edge/xds-tls/server.key
    ca-file: /etc/edge/xds-tls/ca.crt
  tls-cert-file: /etc/edge/tls/tls.crt   # HTTPS on :10443 over SDS; off if the files are missing
  tls-key-file: /etc/edge/tls/tls.key
  backends:
    tableau: tableau:8080
    sales: sales:8080
    billing: billing:8080     # deliberately has no running instances: the demo's "backend is down"
  initial-routes:
    "[tableau.edge.local]": tableau
    "[sales.edge.local]": sales
