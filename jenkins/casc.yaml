# Jenkins configuration as code: admin user, one executor pool, and the pipeline job.
jenkins:
  systemMessage: "edge-control-plane CI (local demo)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
      - id: admin
        password: admin          # local demo only
  authorizationStrategy: loggedInUsersCanDoAnything
unclassified:
  location:
    url: http://localhost:8090/
jobs:
- script: >
    pipelineJob('edge-control-plane') {
      description('Build, unit test, integration test (real Envoy + Postgres), deploy to kind, smoke test')
      // Declared here, not only in the Jenkinsfile: this job is re-created from code on every
      // Jenkins start, which would otherwise drop parameters a previous build registered.
      parameters {
        booleanParam('SIMULATE_SMOKE_FAILURE', false,
            'Fail the smoke test on purpose, to exercise the automatic rollback')
      }
      definition {
        cpsScm {
          scm {
            git {
              remote { url('file:///repo') }
              branch('*/main')
            }
          }
          scriptPath('Jenkinsfile')
          lightweight(false)
        }
      }
    }
